<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>인디스쿨 모니터링</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --tx:#111827; --dim:#6b7280;
  --accent:#2563eb; --hot:#dc2626; --ok:#059669; --chip:#eef2ff; --chiptx:#3730a3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115; --card:#171a21; --line:#272b34; --tx:#e5e7eb; --dim:#9aa1ad;
  --accent:#60a5fa; --hot:#f87171; --ok:#34d399; --chip:#1e2536; --chiptx:#a5b4fc;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Pretendard","Malgun Gothic",-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.55}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.02em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(5,150,105,.18)}
.dot.busy{background:#f59e0b;animation:p 1s infinite}
.dot.err{background:var(--hot)}
@keyframes p{50%{opacity:.3}}
#status{color:var(--dim);flex:1;min-width:200px;font-size:13px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);
  border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{opacity:.9;color:#fff}
nav{display:flex;gap:4px;padding:12px 16px 0}
nav button{border-radius:8px 8px 0 0;border-bottom:none}
nav button.sel{background:var(--card);border-color:var(--line);color:var(--accent);font-weight:700}
main{padding:12px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.post{display:block;text-decoration:none;color:inherit}
.pin{color:var(--dim);font-size:12px;margin:2px 0}
/* 표 */
.tb{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;table-layout:fixed}
.tb th{background:var(--bg);color:var(--dim);font-size:12px;font-weight:700;text-align:left;
  padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.tb tr.r{cursor:pointer}
.tb tr.r:hover td{background:var(--chip)}
.tb tr.on td{background:var(--chip)}
.c-no{width:48px;color:var(--dim);text-align:right}
.c-kw{width:150px}
.c-sum{width:32%;color:var(--dim)}
.c-tm{width:130px}
.c-ti .tw{color:var(--dim);margin-right:4px}
.c-ti .tt{font-weight:650;font-size:14px}
/* td 에 직접 -webkit-box 를 주면 table-cell 이 깨져서 칸 너비가 어그러진다 → 안쪽 div 에만 준다 */
.clamp{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-word}
.team{background:#dcfce7;color:#166534;border-radius:5px;padding:1px 7px;font-size:11px;
  font-weight:700;display:inline-block;margin:1px 2px 1px 0;white-space:nowrap}
@media (prefers-color-scheme:dark){.team{background:#14351f;color:#86efac}}
.dr td{background:var(--bg) !important;padding:0 !important}
.dt{padding:14px 16px 16px}
.dtbar{margin-bottom:8px}
.dtbar a{color:var(--accent);text-decoration:none;font-size:13px}
.body{white-space:pre-wrap;line-height:1.7;font-size:13.5px;max-height:460px;overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.reps{margin-top:12px}
.repshead{color:var(--dim);font-size:12px;font-weight:700;margin-bottom:6px}
.rep{font-size:13px;padding:6px 0 6px 10px;border-left:2px solid var(--line);margin-bottom:4px}
.repwho{font-weight:650;margin-right:6px}
.repwhen{color:var(--dim);font-size:11px}
.reptx{color:var(--tx);white-space:pre-wrap;margin-top:2px}
@media (max-width:900px){.c-sum{display:none}.c-kw{width:100px}.c-tm{width:90px}
  .c-md{width:76px}}
.ptitle{font-weight:650;font-size:15px;margin-bottom:4px;letter-spacing:-.01em}
.meta{color:var(--dim);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.snip{color:var(--dim);font-size:13px;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kw{background:#fee2e2;color:#b91c1c;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700}
@media (prefers-color-scheme:dark){.kw{background:#3f1d1d;color:#fca5a5}}
.chip{background:var(--chip);color:var(--chiptx);border-radius:999px;padding:2px 10px;font-size:12px;
  display:inline-block;margin:3px 4px 0 0}
.new{background:var(--hot);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700}
.bhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.bname{font-weight:700;font-size:15px}
.n{color:var(--dim);font-size:12px}
.sub{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.sub a{display:block;text-decoration:none;color:inherit;padding:4px 0;font-size:13px}
.sub a:hover{color:var(--accent)}
.empty{color:var(--dim);text-align:center;padding:48px 0}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:13px}
input[type=text],input[type=number],select{width:100%;max-width:420px;padding:8px 10px;font:inherit;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 10px;margin-top:6px}
.grid label{display:flex;gap:6px;align-items:center;margin:0;font-weight:400;font-size:13px}
.hint{color:var(--dim);font-size:12px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srow input[type=text]{flex:1;min-width:240px;max-width:none}
label.inl{display:inline-flex;gap:5px;align-items:center;margin:0;font-weight:400;font-size:13px}
#banner{margin:12px 16px 0;border:1px solid #fca5a5;background:#fef2f2;color:#7f1d1d;
  border-radius:12px;padding:14px 16px}
@media (prefers-color-scheme:dark){#banner{background:#2a1414;border-color:#7f1d1d;color:#fecaca}}
#banner .bt{display:block;font-size:15px;margin-bottom:6px;font-weight:700}
#banner ol{margin:6px 0 0;padding-left:20px}
#banner li{margin:2px 0}
#banner details{margin-top:10px;font-size:13px}
#banner summary{cursor:pointer;opacity:.85}
#banner textarea{width:100%;max-width:560px;height:64px;margin-top:6px;padding:8px;font:12px/1.4 Consolas,monospace;
  border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx)}
/* 정렬·추리기 줄 */
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.vbar .n{margin-right:auto}
.vbar select{width:auto;max-width:none;padding:5px 8px;font-size:13px;background:var(--card)}
.tb th.so{cursor:pointer;user-select:none}
.tb th.so:hover{color:var(--accent)}
.tb th.so .ar{color:var(--accent)}
/* 무드 */
.c-md{width:92px}
.mood{border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap;
  display:inline-block}
.m-bad{background:#fee2e2;color:#b91c1c}
.m-idea{background:#f3e8ff;color:#7e22ce}
.m-cmp{background:#ccfbf1;color:#0f766e}
.m-ask{background:#dbeafe;color:#1d4ed8}
.m-sad{background:#e9e5f5;color:#5b4b8a}
.m-thx{background:#fce7f3;color:#be185d}
.m-brag{background:#fef3c7;color:#b45309}
.m-share{background:#e0e7ff;color:#4338ca}
.m-news{background:#cffafe;color:#0e7490}
.m-ad{background:#ffedd5;color:#c2410c}
.m-info{background:#e2e8f0;color:#334155}
.m-chat{background:#f1f5f9;color:#64748b}
@media (prefers-color-scheme:dark){
  .m-bad{background:#3f1d1d;color:#fca5a5}   .m-idea{background:#2c1f3d;color:#d8b4fe}
  .m-cmp{background:#123330;color:#5eead4}   .m-ask{background:#16304f;color:#93c5fd}
  .m-sad{background:#262238;color:#c4b5fd}   .m-thx{background:#3a1a2a;color:#f9a8d4}
  .m-brag{background:#3b2f11;color:#fcd34d}  .m-share{background:#22243f;color:#a5b4fc}
  .m-news{background:#0f2f36;color:#67e8f9}  .m-ad{background:#3a2413;color:#fdba74}
  .m-info{background:#232833;color:#cbd5e1}  .m-chat{background:#1c2029;color:#94a3b8}}
/* 스크랩 */
.c-sc{width:44px;text-align:center}
.sc{border:none;background:none;font-size:15px;line-height:1;padding:3px 5px;cursor:pointer;
  filter:grayscale(1);opacity:.3}
.sc:hover{opacity:.8;filter:none}
.sc.on{filter:none;opacity:1}
.sitem{border-top:1px dashed var(--line);padding:10px 0 12px}
.sitem:first-of-type{border-top:none}
.stitle{font-weight:650;font-size:14px;color:inherit;text-decoration:none}
.stitle:hover{color:var(--accent)}
.sitem input[type=text]{flex:1;min-width:200px;max-width:none}
.sitem select{width:auto;max-width:none;padding:6px 8px}
.bhead .tools{display:flex;gap:6px;align-items:center}
</style></head><body>
<header>
  <h1>🏫 인디스쿨 모니터링</h1>
  <span id="head" class="n"></span>
</header>
<main>
  <div id="gate" class="card" hidden style="max-width:380px;margin:60px auto;text-align:center">

    <div class="hint" style="margin-bottom:12px">받으신 비밀번호를 넣으면 모니터링 내용이 열립니다.</div>
    <input type="password" id="pw" placeholder="비밀번호" style="max-width:none">
    <div class="row" style="justify-content:center"><button class="pri" id="go">열기</button></div>
    <div class="n" id="gerr" style="min-height:20px"></div>
  </div>
  <div id="app">
    <div class="card">
      <div class="srow">
        <input type="text" id="q" placeholder="찾을 말  (제목·요약·본문·댓글·작성자 어디든)">
        <button class="pri" onclick="setQ()">찾기</button>
        <button onclick="document.getElementById('q').value='';setQ()">지우기</button>
      </div>
    </div>
    <div id="bar"></div>
    <div id="out"></div>
  </div>
</main>

const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MOODMAP={'컴플레인':['bad','⚠'],'건의':['idea','💡'],'비교':['cmp','⚖'],
               '문의':['ask','❓'],'하소연':['sad','😥'],'감사':['thx','🙏'],
               '자랑':['brag','🎉'],'공유':['share','📎'],'정보':['news','📰'],
               '홍보':['ad','🛒'],'안내':['info','📢'],'잡담':['chat','💬']};
const MOODORDER=Object.keys(MOODMAP);
function moodChip(m){const nm=m||'잡담',k=MOODMAP[nm]||MOODMAP['잡담'];
  return `<span class="mood m-${k[0]}">${k[1]} ${esc(nm)}</span>`;}

let DATA=null;
let V={sort:'new',team:'',mood:'',kw:'',q:'',only:0};
const opened=new Set();

// 주소 뒤에 조건을 붙여 놓으면 그대로 열린다 (부서에 링크 보낼 때)
(function(){const p=new URLSearchParams(location.search);
  ['sort','team','mood','kw','q'].forEach(k=>{if(p.get(k))V[k]=p.get(k);});
  if(p.get('only'))V.only=1;})();

function setQ(){V.q=$('#q').value.trim();draw();}
function setV(k,v){V[k]=v;draw();}
function setSort(k){V.sort=(V.sort===k?'new':k);draw();}
function clearV(){V.team=V.mood=V.kw='';V.q='';V.only=0;$('#q').value='';draw();}
function toggle(pid){opened.has(pid)?opened.delete(pid):opened.add(pid);draw();}

function hit(p){
  if(V.only && !p.kw) return false;
  if(V.team && (','+(p.tm||'')+',').indexOf(','+V.team+',')<0) return false;
  if(V.mood && (p.md||'잡담')!==V.mood) return false;
  if(V.kw && (','+(p.kw||'')+',').indexOf(','+V.kw+',')<0) return false;
  if(V.q){
    const t=V.q.toLowerCase();
    const blob=[p.t,p.s,p.b,p.a,p.bn,(p.r||[]).map(x=>x.s).join(' ')].join(' ').toLowerCase();
    if(blob.indexOf(t)<0) return false;
  }
  return true;
}

function sorted(rows){
  const r=rows.slice();
  const by={
    new:(a,b)=>(b.f||'').localeCompare(a.f||''),
    old:(a,b)=>(a.f||'').localeCompare(b.f||''),
    mood:(a,b)=>MOODORDER.indexOf(a.md||'잡담')-MOODORDER.indexOf(b.md||'잡담')||(b.f||'').localeCompare(a.f||''),
    kw:(a,b)=>((a.kw||'~').localeCompare(b.kw||'~'))||(b.f||'').localeCompare(a.f||''),
    team:(a,b)=>((a.tm||'~').localeCompare(b.tm||'~'))||(b.f||'').localeCompare(a.f||''),
    board:(a,b)=>((a.bn||'').localeCompare(b.bn||''))||(b.f||'').localeCompare(a.f||''),
    title:(a,b)=>(a.t||'').localeCompare(b.t||''),
  };
  return r.sort(by[V.sort]||by.new);
}

function th(k,label,cls){
  return `<th class="${cls||''} so" onclick="setSort('${k}')">${label}`
    +(V.sort===k?' <span class="ar">▾</span>':'')+`</th>`;
}

function bar(n){
  const opt=(arr,cur)=>arr.map(v=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(v)}</option>`).join('');
  const on=(V.team||V.mood||V.kw||V.q||V.only);
  return `<div class="vbar">
    <span class="n"><b>${n}</b>건 보는 중 · 모두 ${DATA.posts.length}건</span>
    <select onchange="setV('sort',this.value)">
      ${[['new','최신순'],['old','오래된순'],['mood','무드순'],['kw','키워드순'],
         ['team','관련팀순'],['board','게시판순'],['title','제목순']]
        .map(([v,t])=>`<option value="${v}" ${V.sort===v?'selected':''}>${t}</option>`).join('')}
    </select>
    <select onchange="setV('team',this.value)"><option value="">관련팀 전체</option>${opt(DATA.teams,V.team)}</select>
    <select onchange="setV('mood',this.value)"><option value="">무드 전체</option>${opt(DATA.moods,V.mood)}</select>
    <select onchange="setV('kw',this.value)"><option value="">키워드 전체</option>${opt(DATA.keywords,V.kw)}</select>
    <label class="inl"><input type="checkbox" ${V.only?'checked':''}
      onchange="setV('only',this.checked?1:0)"> 키워드 걸린 글만</label>
    ${on?'<button onclick="clearV()">조건 지우기</button>':''}
  </div>`;
}

function row(p,no){
  const o=opened.has(p.id);
  const kws=(p.kw||'').split(',').filter(Boolean);
  const tms=(p.tm||'').split(',').filter(Boolean);
  return `<tr class="r ${o?'on':''}" onclick="toggle('${p.id}')">
    <td class="c-no">${no}</td>
    <td class="c-md">${moodChip(p.md)}</td>
    <td class="c-kw">${kws.map(k=>`<span class="kw">${esc(k)}</span>`).join(' ')}</td>
    <td class="c-ti"><span class="tw">${o?'▾':'▸'}</span>
      ${p.sc?'<span class="new">📌</span> ':''}<span class="tt">${esc(p.t)}</span>
      ${p.pt?`<div class="pin clamp">원글 · ${esc(p.pt)}</div>`:''}
      <div class="meta">${[p.bn,p.a,p.d].filter(Boolean).map(esc).join(' · ')}</div></td>
    <td class="c-sum"><div class="clamp">${esc(p.s||'')}</div></td>
    <td class="c-tm">${tms.map(t=>`<span class="team">${esc(t)}</span>`).join(' ')}</td>
  </tr>` + (o?`<tr class="dr"><td colspan="6">${detail(p)}</td></tr>`:'');
}

function detail(p){
  const reps=p.r||[];
  const body=p.b||p.s||'';
  return `<div class="dt">
    <div class="dtbar" style="display:flex;gap:10px;align-items:center">
      <a href="${esc(p.u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">인디스쿨에서 열기 ↗</a>
      <span style="flex:1"></span>${moodChip(p.md)}
      ${p.sc?`<span class="team">📌 ${esc(p.st||'스크랩')}</span>`:''}
    </div>
    <div class="body">${body?esc(body):'<span class="n">본문을 가져오지 못한 글입니다. 위 [인디스쿨에서 열기] 로 보세요.</span>'}
      ${p.sm?`<div class="n" style="margin-top:8px">📌 메모 : ${esc(p.sm)}</div>`:''}</div>
    ${reps.length?`<div class="reps"><div class="repshead">💬 댓글 ${reps.length}개</div>
      ${reps.map(r=>`<div class="rep"><span class="repwho">${esc(r.a||'익명')}</span>
        <span class="repwhen">${esc(r.d||'')}</span>
        <div class="reptx">${esc(r.s||'')}</div></div>`).join('')}</div>`:''}
  </div>`;
}

function draw(){
  const rows=sorted(DATA.posts.filter(hit));
  $('#bar').innerHTML=bar(rows.length);
  const show=rows.slice(0,1500);
  $('#out').innerHTML=rows.length
    ? `<table class="tb"><thead><tr><th class="c-no">NO</th>
        ${th('mood','무드','c-md')}${th('kw','키워드','c-kw')}${th('title','글 제목')}
        <th class="c-sum">글 요약</th>${th('team','관련팀','c-tm')}</tr></thead>
       <tbody>${show.map((p,i)=>row(p,i+1)).join('')}</tbody></table>`
       + (rows.length>show.length?`<div class="n" style="padding:10px">아래로 ${rows.length-show.length}건 더 있습니다. 조건을 좁혀 보세요.</div>`:'')
    : '<div class="empty">고른 조건에 맞는 글이 없습니다.<br>위 <b>[조건 지우기]</b> 를 눌러 보세요.</div>';
}

function start(D){
  DATA=D;
  $('#gate').hidden=true; $('#app').hidden=false;
  $('#head').innerHTML=`가장 최근 글 ${esc(DATA.made)} · 최근 ${DATA.days}일 · 모두 ${DATA.posts.length}건`
    +` · <span class="n">관련팀은 자동으로 붙인 참고 표시라 100% 맞지 않습니다. 모든 글이 다 들어 있습니다.</span>`;
  $('#q').value=V.q;
  $('#q').onkeydown=e=>{if(e.key==='Enter')setQ();};
  draw();
}

// ── 비밀번호로 잠가 둔 경우 ──
const b64d=s=>{const b=atob(s),u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
const hex=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');

async function unlock(){
  const pw=$('#pw').value;
  if(!pw){$('#gerr').textContent='비밀번호를 넣어 주세요.';return;}
  $('#gerr').textContent='여는 중입니다…';
  try{
    const enc=new TextEncoder();
    const salt=b64d(LOCK.salt), ct=b64d(LOCK.ct);
    const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const keyBits=await crypto.subtle.deriveBits(
      {name:'PBKDF2',salt:salt,iterations:LOCK.iters,hash:'SHA-256'},base,256);
    const key=new Uint8Array(keyBits);
    const hk=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']);
    if(hex(new Uint8Array(await crypto.subtle.sign('HMAC',hk,ct)))!==LOCK.tag){
      $('#gerr').textContent='비밀번호가 다릅니다.'; return;
    }
    const kb=await crypto.subtle.importKey('raw',key,'PBKDF2',false,['deriveBits']);
    const salt2=new Uint8Array([...salt,...enc.encode('S')]);
    const ks=new Uint8Array(await crypto.subtle.deriveBits(
      {name:'PBKDF2',salt:salt2,iterations:1,hash:'SHA-256'},kb,ct.length*8));
    const out=new Uint8Array(ct.length);
    for(let i=0;i<ct.length;i++) out[i]=ct[i]^ks[i];
    start(JSON.parse(new TextDecoder().decode(out)));
  }catch(e){ $('#gerr').textContent='여는 데 실패했습니다: '+e; }
}

if(LOCK){
  $('#app').hidden=true; $('#gate').hidden=false;
  $('#go').onclick=unlock;
  $('#pw').onkeydown=e=>{if(e.key==='Enter')unlock();};
  setTimeout(()=>$('#pw').focus(),50);
  if(!(window.crypto&&window.crypto.subtle))
    $('#gerr').innerHTML='이 페이지는 <b>https 주소</b>에서 열어야 비밀번호를 풀 수 있습니다.<br>(파일을 직접 열면 브라우저가 막습니다)';
}else{
  start(OPEN_DATA);
}
</script>
